[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "gramep"
version = "1.3.0"
requires-python = ">=3.14"
description = "GRAMEP - Genome vaRiation Analysis from the Maximum Entropy Principle"
authors = [
    { name="Matheus Pimenta", email="omatheuspimenta@outlook.com"},
    { name="Fabricio Lopes", email="fabricio@utfpr.edu.br"},
    ]
maintainers = [
    { name="Matheus Pimenta", email="omatheuspimenta@outlook.com"},
]
readme = "README.md"
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Environment :: Console",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "rich >=15.0.0",
    "typer >=0.27.3",
    "typing_extensions >=4.12.2",
    "biopython >=1.88",
    "pandas >=2.3.3,<3",
    "gffpandas >=1.2.0",
    "joblib >=1.6.0",
    "joblib-progress >=1.0.6",
    "matplotlib >=3.11.2",
    "upsetplot >=0.9.0",
    "scikit-learn >=1.9.1",
    "seaborn >=0.13.2",
    "thefuzz >=0.22.1",
]


[project.urls]
"Code" = "https://github.com/omatheuspimenta/GRAMEP"
"Bug Tracker" = "https://github.com/omatheuspimenta/GRAMEP/issues"
"Documentation" = "https://gramep.readthedocs.io/en/latest/"

[tool.maturin]
python-source = "python"
module-name = "gramep.utilrs"
features = ["pyo3/extension-module"]


[project.scripts]
gramep = "gramep.cli:app"

[project.optional-dependencies]
dev = [
    "maturin >=1.16.0",
    "pytest >=9.2.0",
    "pytest-cov >=7.1.0",
    "taskipy >=1.14.1",
    "isort >=9.0.2",
    "ruff >=0.17.3",
    ]

doc = [
    "mkdocstrings >=1.0.8",
    "mkdocstrings-python >=2.0.10",
    "mkdocs-macros-plugin >=1.5.0",
    "jinja2 >=3.1.6",
    "termynal >=0.14.0",
    "mkdocs-material >=9.8.0",
    ]

[tool.pytest.ini_options]
pythonpath = "python/"
addopts = "--doctest-modules"

[tool.isort]
profile = "black"
line_length = 79
known_first_party = ["gramep"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.taskipy.tasks]
codeck = "ruff format --check --diff python/ && isort --check --diff python/"
codecg = "ruff format python/ && isort python/"
docs = "mkdocs serve"
pre_test = "task codeck"
test = "pytest -s -x --cov=gramep -vv"
post_test = "coverage html"

